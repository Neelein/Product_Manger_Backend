name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./src/...

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: productdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration -count=1 -p=1 -v ./src/test/api ./src/test/database
        env:
          DATABASE_URL: postgres://root:root123@localhost:5432/productdb?sslmode=disable

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: productdb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Checkout frontend (matching branch)
        uses: actions/checkout@v4
        with:
          repository: Neelein/Product_Manger_frontend
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          path: frontend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgres://root:root123@localhost:5432/productdb_e2e?sslmode=disable
          E2E_BACKEND_DIR: ${{ github.workspace }}
        run: npx playwright test

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/neelein/product_manager_backend:latest
            ghcr.io/neelein/product_manager_backend:${{ github.sha }}

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p /home/runner/.ssh
          echo "$SSH_KEY" > /home/runner/.ssh/deploy_key
          chmod 600 /home/runner/.ssh/deploy_key

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/deploy_key
          script: |
            docker pull ghcr.io/neelein/product_manager_backend:latest
            docker exec my_postgres_db psql -U root -c "CREATE DATABASE productdb;" 2>/dev/null || true
            docker stop pm_app || true
            docker rm pm_app || true
            docker run -d \
              --name pm_app \
              --network my_app_net \
              --restart unless-stopped \
              -p 8090:8090 \
              -v /root/Product/product_manger/media:/app/media \
              -e MEDIA_ROOT=/app/media \
              -e API_DOMAIN=https://你的網域.com \
              -e API_GATEWAY_SECRET="${{ secrets.API_GATEWAY_SECRET }}" \
              -e DATABASE_URL="postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@my_postgres_db:5432/productdb?sslmode=disable" \
              ghcr.io/neelein/product_manager_backend:latest
