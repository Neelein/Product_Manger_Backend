name: E2E

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: productdb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Checkout frontend (matching branch)
        uses: actions/checkout@v4
        with:
          repository: Neelein/Product_Manger_frontend
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          path: frontend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgres://root:root123@localhost:5432/productdb_e2e?sslmode=disable
          E2E_BACKEND_DIR: ${{ github.workspace }}
        run: npx playwright test

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14